[project]
name = "orinfer-tools"
version = "0.2.0"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["artifacts", "target", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "PLW0127"]
# TileLang tensor names follow the mathematical notation in the operator ABI.
ignore = ["E741"]
